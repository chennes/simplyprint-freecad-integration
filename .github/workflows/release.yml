name: Release

# Build the addon zip and publish a GitHub release for the version currently in
# package.xml. Runs on every push to main (bump the version with
# scripts/bump_version.py to cut a new release) and on manual dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build addon zip
        run: python build.py

      - name: Read version
        id: version
        run: |
          version="$(python -c "import build; print(build.read_version())")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SimplyPrint v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/SimplyPrint.zip
